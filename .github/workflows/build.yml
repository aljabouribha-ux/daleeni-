name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Extract Project Files
        run: |
          unzip -o daleeni_flutter_fixed.zip -d .
          ls -la

      - name: Find Project Directory and Build APK
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -maxdepth 2 -exec dirname {} \;)
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # إنشاء الحد الأدنى من ملفات الأندرويد المفقودة لتجاوز خطأ v1 embedding
          mkdir -p android/app/src/main
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.daleeni"><application android:label="daleeni" android:name="${applicationName}" android:icon="@mipmap/ic_launcher"><activity android:name=".MainActivity" android:exported="true" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > android/app/src/main/AndroidManifest.xml
          fi

          # ضبط إعدادات الجريدل المتوافقة
          mkdir -p android/gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties

          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties

          flutter pub get
          flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/outputs/apk/release/*.apk'
