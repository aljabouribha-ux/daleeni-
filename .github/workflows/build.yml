name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Extract Project Files
        run: |
          unzip -o daleeni_flutter_fixed.zip -d .
          ls -la

      - name: Find Project Directory and Build APK
        run: |
          PROJECT_DIR=$(find . -name "pubspec.yaml" -maxdepth 2 -exec dirname {} \;)
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # إذا كان مجلد android غير موجود أو ناقص، نقوم بتوليده نظيفاً وحديثاً
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.example
          else
            # تحديث دعم الأندرويد إلى الإصدار الحديث في حال وجد مجلد قديم
            rm -rf android
            flutter create . --platforms=android --org com.example
          fi

          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: '**/outputs/apk/release/*.apk'
